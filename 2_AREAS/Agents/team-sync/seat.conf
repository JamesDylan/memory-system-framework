# Per-seat settings. run.sh and the shared gate (../meeting-ingest/gate.py) read this file; change the model here, nowhere else.
# One-off override without editing: SEAT_MODEL=<model> ./run.sh

# Sonnet: one meeting, one short summary.
MODEL=claude-sonnet-5-5

# Ceilings (law 5). One round per Wednesday meeting.
MAX_TURNS=20
MAX_BUDGET_USD=2

# Tools the seat may use (law 2). No Bash, no Slack.
TOOLS="Read,Write,Glob,Grep"

# Gate. Only the Wednesday PM team meetings; both alternate weeks write to the same canvas.
TITLE_MATCH='{{PRODUCT}} Team - Roadmap|{{PRODUCT}} Product Team - Fortnightly Ops'
LOOKBACK_HOURS=48
MAX_MEETINGS=1
MIN_ATTENDEES=3

# The canvas the summary goes to (canvas.py). Not a secret.
CANVAS_ID=SLACK_CANVAS_ID
