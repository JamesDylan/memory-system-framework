# Per-seat settings. run.sh and gate.sh read this file; change the model here, nowhere else.
# One-off override without editing: SEAT_MODEL=<model> ./run.sh

# Sonnet: reads a long transcript and compares it with STATE. Move to Opus if hand runs show weak scope calls.
MODEL=claude-sonnet-5-5

# Ceilings (law 5). Worst-case weekly cost = MAX_BUDGET_USD x runs per week. Written in AGENTS.md.
MAX_TURNS=40
MAX_BUDGET_USD=3

# Tools the seat may use (law 2). No Bash.
TOOLS="Read,Edit,Write,Glob,Grep"

# Gate (gate.py). Calendar events from the last LOOKBACK_HOURS with a Meet transcript attached.
# Wide enough to catch a transcript that attaches late. MAX_MEETINGS per round is a cost ceiling; the rest wait.
LOOKBACK_HOURS=48
MAX_MEETINGS=3
# Privacy: 1:1s also get Gemini notes. Fewer people than this (rooms not counted): never exported.
MIN_ATTENDEES=3
