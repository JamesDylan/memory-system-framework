# Per-seat settings. run.sh reads this file; change the model here, nowhere else.
# One-off override without editing: SEAT_MODEL=<model> ./run.sh

# Sonnet: reads a short job and a few vault files, writes three short files.
MODEL=claude-sonnet-5-5

# Ceilings (law 5). One job per run. Worst-case weekly cost = MAX_BUDGET_USD x jobs per week.
MAX_TURNS=30
MAX_BUDGET_USD=2

# Tools the seat may use (law 2). No Bash: run.sh runs the hub script after the round.
TOOLS="Read,Edit,Write,Glob,Grep"

# Evals (.scripts/run_evals.py reads these). SERVERS: the MCP servers in seat.mcp.json, nothing more (a lock checks it).
# RUNNER: how behaviour cases in evals/cases/ run: slack (made-up Slack posts), notes (meeting notes against the vault),
# team-notes (team-meeting notes to a draft), jobs (a made-up job file against a copy of the vault). Empty: locks only.
SERVERS="qmd"
RUNNER=jobs
