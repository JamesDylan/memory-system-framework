# Per-seat settings. run.sh reads this file; change the model here, nowhere else.
# One-off override without editing: SEAT_MODEL=<model> ./run.sh

# Model. Pick by the hardest thing the seat must do, then prove it with .scripts/run_evals.py --seat <seat> --model <model>.
#   claude-haiku-5-5   Mechanical: copy, format, route, summarise one short source. Cheapest.
#   claude-sonnet-5-5  Default. Read several sources, compare, write a short sourced note.
#   claude-opus-5-5    Hard judgment: conflicting evidence, long documents, a wrong answer is costly.
# Full ids are pinned. An alias (haiku, sonnet, opus) moves to the newest model without a warning.
MODEL=claude-sonnet-5-5

# Ceilings (law 5). Worst-case weekly cost = MAX_BUDGET_USD x runs per week. Write it in the brief.
MAX_TURNS=25
MAX_BUDGET_USD=2

# Tools the seat may use (law 2). Smallest list that does the job.
TOOLS="Read,Edit,Write"   # add Bash only with one exact checker command allowed in guard.py

# Evals (.scripts/run_evals.py reads these). SERVERS: the MCP servers in seat.mcp.json, nothing more (a lock checks it).
# RUNNER: how behaviour cases in evals/cases/ run: slack (made-up Slack posts), notes (meeting notes against the vault),
# team-notes (team-meeting notes to a draft). Empty: locks only.
SERVERS="qmd"
RUNNER=slack
